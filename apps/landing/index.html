<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Ban Thanh Niên — Hội Thánh Tin Lành Việt Nam, Chi Hội Sài Gòn. Nơi người trẻ gặp gỡ Chúa, gắn kết cộng đồng và sống cho điều cao đẹp."
    />
    <meta name="theme-color" content="#07060b" />
    <title>Ban Thanh Niên — HTTL Sài Gòn</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Ảnh & mô tả khi chia sẻ link lên Facebook/Zalo (bot không chạy JS nên phải nằm sẵn ở đây). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Ban Thanh Niên HTTL Sài Gòn" />
    <meta property="og:url" content="https://btnsg.vercel.app/" />
    <meta property="og:title" content="Ban Thanh Niên — HTTL Sài Gòn" />
    <meta
      property="og:description"
      content="Nơi người trẻ gặp gỡ Chúa, gắn kết cộng đồng và sống cho điều cao đẹp. Hẹn bạn mỗi chiều Chúa Nhật lúc 14:30."
    />
    <meta property="og:image" content="https://btnsg.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Tải nội dung (chỉnh từ dashboard) song song với bundle JS — main.jsx chờ promise này trước khi vẽ.
      window.__siteContent = fetch("/api/site-content")
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    </script>
    <script>
      // Đặt theme trước khi vẽ trang để không bị nháy sáng/tối.
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
