<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Ban Thanh Niên — Hội Thánh Tin Lành Việt Nam, Chi Hội Sài Gòn. Nơi người trẻ gặp gỡ Chúa, gắn kết cộng đồng và sống cho điều cao đẹp."
    />
    <meta name="theme-color" content="#07060b" />
    <title>Ban Thanh Niên — HTTL Sài Gòn</title>
    <script>
      // Đặt theme trước khi vẽ trang để không bị nháy sáng/tối.
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
