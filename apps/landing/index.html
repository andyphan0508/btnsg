<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Ban Thanh Niên — Hội Thánh Tin Lành Việt Nam, Chi Hội Sài Gòn. Nơi người trẻ gặp gỡ Chúa, gắn kết cộng đồng và sống cho điều cao đẹp."
    />
    <meta name="theme-color" content="#07060b" />
    <title>Ban Thanh Niên — HTTL Sài Gòn</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Ảnh & mô tả khi chia sẻ link lên Facebook/Zalo (bot không chạy JS nên phải nằm sẵn ở đây). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Ban Thanh Niên HTTL Sài Gòn" />
    <meta property="og:url" content="https://btnsg.vercel.app/" />
    <meta property="og:title" content="Ban Thanh Niên — HTTL Sài Gòn" />
    <meta
      property="og:description"
      content="Nơi người trẻ gặp gỡ Chúa, gắn kết cộng đồng và sống cho điều cao đẹp. Hẹn bạn mỗi chiều Chúa Nhật lúc 14:30."
    />
    <meta property="og:image" content="https://btnsg.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Bắt đầu tải dữ liệu ngay từ lúc mở trang, song song với bundle JS (thay vì đợi JS chạy xong mới gọi):
      // nội dung chỉnh từ dashboard + danh sách ảnh thư viện (qua proxy có cache CDN).
      function early(url) {
        return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      }
      window.__siteContent = early("/api/site-content");
      window.__galleryFeed = early("/api/feed?src=gallery");
    </script>
    <script>
      // Đặt theme trước khi vẽ trang để không bị nháy sáng/tối.
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font không chặn vẽ trang: splash hiện ngay, chữ đổi sang Geist khi font về. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet" />
    </noscript>
    <style>
      /* Màn chờ: vẽ ngay từ byte HTML đầu tiên, main.jsx làm mờ dần khi trang đã sẵn sàng. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        --splash-text: #f6f1ea;
        background: #07060b;
        color: var(--splash-text);
        font: 600 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.55s;
        /* Lưới an toàn: JS hỏng thì không kẹt mãi ở màn chờ. */
        animation: splash-away 0.4s 12s forwards;
      }
      [data-theme="light"] #splash { --splash-text: #17110c; background: #f5efe6; }
      #splash.is-done { opacity: 0; visibility: hidden; }
      #splash .splash-logo {
        position: relative;
        width: 88px;
        height: 88px;
        animation: splash-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both, splash-float 3.2s ease-in-out 1s infinite;
      }
      /* ::before = vầng sáng phía sau, ::after = logo (vẽ sau nên nằm trên). */
      #splash .splash-logo::before,
      #splash .splash-logo::after {
        content: "";
        position: absolute;
        border-radius: 50%;
      }
      #splash .splash-logo::before {
        inset: -46px;
        background: radial-gradient(closest-side, rgb(255 154 61 / 0.45), transparent);
        animation: splash-glow 2.4s ease-in-out infinite;
      }
      #splash .splash-logo::after {
        inset: 0;
        background: #fff url(/icon-192.png) center / 86% no-repeat;
        box-shadow: 0 0 0 1px rgb(255 154 61 / 0.35), 0 18px 60px -12px rgb(255 120 40 / 0.6);
      }
      #splash .splash-name {
        background: linear-gradient(100deg, var(--splash-text) 40%, #ff9a3d 50%, var(--splash-text) 60%) 0 0 / 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: splash-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both, splash-shine 2.2s linear 1s infinite;
      }
      #splash .splash-bar {
        width: 120px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgb(127 127 127 / 0.22);
        animation: splash-in 0.6s ease 0.4s both;
      }
      #splash .splash-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ff6a2a, #ffc24a);
        animation: splash-run 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-in { from { opacity: 0; transform: translateY(14px) scale(0.92); } }
      @keyframes splash-float { 50% { transform: translateY(-6px); } }
      @keyframes splash-glow { 50% { opacity: 0.55; transform: scale(0.85); } }
      @keyframes splash-shine { to { background-position: -150% 0; } }
      @keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes splash-away { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before, #splash *::after { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-logo"></div>
      <div class="splash-name">Ban Thanh Niên</div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
