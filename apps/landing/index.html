<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Ban Thanh Niên — Hội Thánh Tin Lành Việt Nam, Chi Hội Sài Gòn. Nơi người trẻ gặp gỡ Chúa, gắn kết cộng đồng và sống cho điều cao đẹp."
    />
    <meta name="theme-color" content="#12100e" />
    <title>Ban Thanh Niên — HTTL Sài Gòn</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Ảnh & mô tả khi chia sẻ link lên Facebook/Zalo (bot không chạy JS nên phải nằm sẵn ở đây). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Ban Thanh Niên HTTL Sài Gòn" />
    <meta property="og:url" content="https://btnsg.vercel.app/" />
    <meta property="og:title" content="Ban Thanh Niên — HTTL Sài Gòn" />
    <meta
      property="og:description"
      content="Nơi người trẻ gặp gỡ Chúa, gắn kết cộng đồng và sống cho điều cao đẹp. Hẹn bạn mỗi chiều Chúa Nhật lúc 14:30."
    />
    <meta property="og:image" content="https://btnsg.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Bắt đầu tải dữ liệu ngay từ lúc mở trang, song song với bundle JS (thay vì đợi JS chạy xong mới gọi):
      // nội dung chỉnh từ dashboard + danh sách ảnh thư viện (qua proxy có cache CDN).
      function early(url) {
        return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      }
      window.__siteContent = early("/api/site-content");
      window.__momentsFeed = early("/api/library?t=moments");
    </script>
    <script>
      // Đặt theme trước khi vẽ trang để không bị nháy sáng/tối.
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font không chặn vẽ trang: splash hiện ngay, chữ đổi sang Geist khi font về. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet" />
    </noscript>
    <style>
      /* Màn chờ tối giản đơn sắc: vẽ ngay từ byte HTML đầu tiên, main.jsx làm mờ dần khi sẵn sàng. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        --splash-text: #f5efe8;
        --splash-accent: #e6754a;
        --splash-line: rgb(245 239 232 / 0.14);
        background: #12100e;
        color: var(--splash-text);
        font: 600 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.4s;
        animation: splash-away 0.4s 12s forwards;
      }
      [data-theme="light"] #splash {
        --splash-text: #231b15;
        --splash-accent: #d96236;
        --splash-line: rgb(35 27 21 / 0.12);
        background: #faf7f2;
      }
      #splash.is-done { opacity: 0; visibility: hidden; }
      #splash .splash-logo {
        position: relative;
        width: 72px;
        height: 72px;
        animation: splash-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #splash .splash-logo::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #fff url(/icon-192.png) center / 84% no-repeat;
        border: 1px solid var(--splash-line);
      }
      #splash .splash-name {
        color: var(--splash-text);
        animation: splash-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      }
      #splash .splash-bar {
        width: 96px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: var(--splash-line);
      }
      #splash .splash-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: var(--splash-accent);
        animation: splash-run 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-in { from { opacity: 0; transform: translateY(8px); } }
      @keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes splash-away { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before, #splash *::after { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-logo"></div>
      <div class="splash-name">Ban Thanh Niên</div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
